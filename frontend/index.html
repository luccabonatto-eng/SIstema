<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opticom ERP — Protótipo</title>
  <script src="react.development.js"></script>
  <script src="react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-client.js"></script>
  <script src="validators.js"></script>
  <script src="notifications.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── Scrollbars finas em toda a página ──────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ── Todo container que envolve uma <table> rola na horizontal ─ */
    /* Usa :has() — suportado em Chrome 105+, Safari 15.4+, Firefox 121+ */
    .overflow-hidden:has(> table),
    .overflow-hidden:has(> div > table),
    .overflow-hidden:has(> .overflow-x-auto) {
      overflow-x: auto !important;
    }

    /* ── Garante que tabelas nunca quebrem o layout ─────────────── */
    table {
      min-width: max-content;
    }

    /* ── Grids multi-coluna responsivos ─────────────────────────── */
    /* Containers diretos de página com padding p-5/p-6 têm scroll */
    .p-5.space-y-4,
    .p-5.space-y-5,
    .p-6.space-y-4,
    .p-6.space-y-5 {
      min-width: 0;
    }

    /* ── Conteúdo principal de cada página ──────────────────────── */
    /* O flex-1 overflow-y-auto recebe também overflow-x */
    .flex-1.overflow-y-auto {
      overflow-x: auto;
    }

    /* ── Grids que podem ser largos demais ──────────────────────── */
    /* Permite scroll horizontal nos grid containers sem quebrar o layout */
    .grid {
      min-width: 0;
    }
    .grid > * {
      min-width: 0;
    }
  </style>
</head>
<body class="bg-gray-50">
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#64748b">Carregando...</div></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#dc2626;background:#fef2f2;border-radius:8px;margin:40px"><h2>Erro ao carregar</h2><pre style="white-space:pre-wrap;font-size:13px">' + msg + '\n' + src + ':' + line + '</pre></div>';
};
</script>
<script src="app.js"></script>
</body>
</html>
